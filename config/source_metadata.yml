sources:
  - source_name: "customers"
    source_type: "file_storage"
    location_or_endpoint: "data/customers.csv"
    owner: "CRM / Sales Operations"
    description: "Customer account profiles and demographic segmentation data."
    record_count: 250
    schema:
      - name: "customer_id"
        type: "string"
      - name: "first_name"
        type: "string"
      - name: "last_name"
        type: "string"
      - name: "email"
        type: "string"
      - name: "city"
        type: "string"
      - name: "signup_date"
        type: "date_string"
      - name: "customer_segment"
        type: "string"
    primary_or_candidate_key: "customer_id"
    update_pattern: "batch_full_refresh"
    known_quality_issues:
      - "3 missing email values"
      - "2 missing city values"
      - "2 completely duplicate rows"
      - "3 duplicate customer_id keys"
    acquisition_method: "file_copy_with_hash_manifest"
    validation_checks:
      - "sha256_hash_check"
      - "file_size_check"
      - "duplicate_detection"

  - source_name: "orders"
    source_type: "file_storage"
    location_or_endpoint: "data/orders.json"
    owner: "E-Commerce Checkout Team"
    description: "Order transaction records including items, totals, and nested shipping details."
    record_count: 250
    schema:
      - name: "order_id"
        type: "string"
      - name: "customer_id"
        type: "string"
      - name: "item_count"
        type: "integer"
      - name: "order_timestamp"
        type: "iso_timestamp"
      - name: "shipping"
        type: "nested_object"
      - name: "shipping_fee"
        type: "float"
      - name: "status"
        type: "string"
      - name: "subtotal"
        type: "float"
      - name: "total_amount"
        type: "float"
    primary_or_candidate_key: "order_id"
    update_pattern: "batch_append"
    known_quality_issues: []
    acquisition_method: "file_copy_with_hash_manifest"
    validation_checks:
      - "sha256_hash_check"
      - "json_syntax_validation"
      - "null_field_count"

  - source_name: "products"
    source_type: "file_storage"
    location_or_endpoint: "data/products.parquet"
    owner: "Catalog & Inventory Team"
    description: "Product catalog records with pricing, category, and inventory levels."
    record_count: 200
    schema:
      - name: "product_id"
        type: "string"
      - name: "product_name"
        type: "string"
      - name: "category"
        type: "string"
      - name: "brand"
        type: "string"
      - name: "unit_price"
        type: "float64"
      - name: "stock_quantity"
        type: "int32"
      - name: "weight_kg"
        type: "float64"
    primary_or_candidate_key: "product_id"
    update_pattern: "batch_snapshot"
    known_quality_issues: []
    acquisition_method: "file_copy_with_hash_manifest"
    validation_checks:
      - "sha256_hash_check"
      - "parquet_schema_verification"
      - "null_field_count"

  - source_name: "support_tickets"
    source_type: "relational_database"
    location_or_endpoint: "dss150p-lab2-postgres:5432/dss150p.public.support_tickets"
    owner: "Customer Support Team"
    description: "Support ticket cases logged with priority, assignment, and resolution timestamps."
    record_count: 250
    schema:
      - name: "ticket_id"
        type: "integer"
      - name: "customer_id"
        type: "varchar(10)"
      - name: "category"
        type: "varchar(40)"
      - name: "priority"
        type: "varchar(10)"
      - name: "assigned_agent"
        type: "varchar(80)"
      - name: "opened_at"
        type: "timestamp without time zone"
      - name: "resolved_at"
        type: "timestamp without time zone"
      - name: "status"
        type: "varchar(20)"
    primary_or_candidate_key: "ticket_id"
    update_pattern: "transactional_oltp"
    known_quality_issues:
      - "125 unresolved tickets where resolved_at is null"
    acquisition_method: "read_only_sql_query"
    validation_checks:
      - "primary_key_uniqueness"
      - "non_null_opened_at"

  - source_name: "api_events"
    source_type: "rest_api"
    location_or_endpoint: "http://127.0.0.1:8000/api/events"
    owner: "Product Analytics Team"
    description: "Clickstream and interaction events retrieved incrementally via paginated REST endpoint."
    record_count: 120
    schema:
      - name: "event_id"
        type: "string"
      - name: "customer_id"
        type: "string"
      - name: "event_type"
        type: "string"
      - name: "amount"
        type: "float"
      - name: "updated_at"
        type: "iso_timestamp"
      - name: "metadata"
        type: "nested_object"
      - name: "_ingested_at"
        type: "iso_timestamp"
      - name: "_source"
        type: "string"
    primary_or_candidate_key: "event_id"
    update_pattern: "incremental_watermark"
    known_quality_issues:
      - "2 duplicate events returned across paginated windows"
    acquisition_method: "paginated_rest_get_with_watermark"
    validation_checks:
      - "watermark_progression_check"
      - "event_id_deduplication"
      - "atomic_jsonl_write"